    <!-- Preconnect Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preload critical local fonts (gg sans) -->

  <link rel="icon" type="image/png" href="/apple-touch-icon-180x180.png">
  <script>
    // Anti-FOUC: applique la préférence de thème AVANT le premier paint.
    (function () {
      try {
        var stored = localStorage.getItem('nexuschat:theme');
        var pref = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'dark';
        var resolved = pref === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        var root = document.documentElement;
        if (resolved === 'dark') root.classList.add('dark');
        else root.classList.add('light');
        root.style.colorScheme = resolved;
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <meta property="og:title" content="BCord - Messagerie instantannée">
  <meta name="twitter:title" content="BCord - Messagerie instantannée">
  <meta property="og:description" content="BCord est une plateforme de messagerie et VoIP optimisée pour les communautés de gamers. Créez des serveurs.">
  <meta name="twitter:description" content="BCord est une plateforme de messagerie et VoIP optimisée pour les communautés de gamers. Créez des serveurs.">
</head>
